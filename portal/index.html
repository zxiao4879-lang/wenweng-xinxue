<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f0e4">
<title>码上清廉 · 作品选择</title>
<style>
:root{color-scheme:light;--ink:#243e34;--muted:#66766a;--red:#ad4936;--paper:#f5f0e4;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:#e5dfd0}
*{box-sizing:border-box}body{margin:0;min-width:280px}.page{max-width:560px;min-height:100vh;margin:auto;padding:25px 22px 30px;background:var(--paper);overflow:hidden;position:relative;box-shadow:0 0 48px #33433718}
.brand{display:flex;align-items:center;gap:10px;color:#52685a;font-size:12px;font-weight:700;letter-spacing:.17em}.seal{width:30px;height:30px;background:#ac4a38;color:#fff9ec;display:grid;place-items:center;font:19px "Songti SC",SimSun,serif;letter-spacing:0;border-radius:3px}
header{position:relative;padding:29px 0 27px;border-bottom:1px solid #d8d1be;min-height:187px}.eyebrow{color:#a44c39;font-size:11px;font-weight:700;letter-spacing:.18em;margin:0 0 10px}h1{font-family:"Songti SC","STSong",SimSun,serif;font-size:clamp(37px,10vw,48px);letter-spacing:.1em;margin:0;line-height:1.2;font-weight:700}.subtitle{font-size:14px;line-height:1.65;color:#667368;margin:10px 0 0;max-width:220px}.pony{position:absolute;right:0;bottom:-5px;width:clamp(88px,29vw,130px);height:148px;object-fit:contain;object-position:bottom right;pointer-events:none}
.section-head{display:flex;align-items:end;justify-content:space-between;margin:23px 1px 13px}.section-head h2{font-family:"Songti SC","STSong",SimSun,serif;font-size:19px;letter-spacing:.1em;margin:0}.section-head span{font-size:11px;color:#7d897d;letter-spacing:.05em}.choices{display:grid;gap:14px}
.choice{height:174px;display:block;position:relative;overflow:hidden;text-decoration:none;color:#fffaf0;border-radius:9px;background:#425b49;box-shadow:0 8px 18px #39412d1c;isolation:isolate}.choice.story{background-color:#795335;background-image:linear-gradient(90deg,rgba(31,37,28,.89) 0%,rgba(36,42,30,.70) 44%,rgba(42,48,32,.10) 100%),url('https://279542.github.io/wenweng-xinxue/assets/bg-classroom-v2.webp');background-size:cover;background-position:center 46%}.choice.game{background-color:#566e5b;background-image:linear-gradient(90deg,rgba(27,52,41,.92) 0%,rgba(32,60,46,.76) 44%,rgba(44,67,49,.14) 100%),url('https://zxiao4879-lang.github.io/wenweng-xinxue/art/mobile/academy-courtyard-v2.webp');background-size:cover;background-position:center}
.choice:focus-visible{outline:3px solid #b5513b;outline-offset:4px}.choice:active{transform:scale(.99)}.content{position:absolute;inset:0;padding:19px 20px;display:flex;flex-direction:column;align-items:flex-start}.tag{font-size:11px;letter-spacing:.15em;color:#f3dcae;margin-bottom:auto}.choice h3{font-family:"Songti SC","STSong",SimSun,serif;font-size:28px;letter-spacing:.08em;line-height:1.1;margin:0 0 8px;text-shadow:0 1px 3px #17261c99}.choice p{font-size:13px;line-height:1.5;margin:0;color:#fff8e7;text-shadow:0 1px 3px #17261c}.go{position:absolute;right:18px;bottom:18px;width:38px;height:38px;display:grid;place-items:center;border:1px solid #fffdf2b5;border-radius:50%;font-size:22px;background:#263d3266;color:white}
footer{text-align:center;margin-top:24px;color:#899386;font-size:11px;letter-spacing:.15em}.dot{color:#ad5541;padding:0 8px}@media(max-width:340px){.page{padding:20px 17px 26px}header{padding-top:24px;min-height:174px}.pony{width:98px;height:125px}.choice{height:158px}.content{padding:16px 17px}.choice h3{font-size:25px}.choice p{font-size:12px}.section-head{margin-top:19px}}
</style>
</head>
<body><main class="page">
<div class="brand"><span class="seal" aria-hidden="true">廉</span><span>码上清廉 · 数字作品</span></div>
<header><p class="eyebrow">故事与游历，从这里开始</p><h1>码上清廉</h1><p class="subtitle">跟随小马翁<br>一起开启清廉之旅</p><img class="pony" src="https://279542.github.io/wenweng-xinxue/assets/xm-orange-idle.webp" alt="" aria-hidden="true"></header>
<div class="section-head"><h2>选择作品</h2><span>点击进入体验</span></div>
<nav class="choices" aria-label="选择作品">
<a class="choice story" href="https://279542.github.io/wenweng-xinxue/"><span class="content"><span class="tag">互动故事 · 文翁兴学</span><h3>文翁篇</h3><p>走进一段兴学育人的故事</p><span class="go" aria-hidden="true">→</span></span></a>
<a class="choice game" href="https://zxiao4879-lang.github.io/wenweng-xinxue/"><span class="content"><span class="tag">互动闯关 · 成都长卷</span><h3>廉字闯关</h3><p>游历成都，解锁清廉故事</p><span class="go" aria-hidden="true">→</span></span></a>
</nav><footer>小故事<span class="dot">·</span>悟大道理</footer>
</main>
<script>
(function () {
  // Replace with the verified event collector URL before deployment.
  var ANALYTICS_ENDPOINT = 'https://mas-qinglian-statistics.netlify.app/event';
  if (!ANALYTICS_ENDPOINT) return;

  function track(eventName) {
    var payload = JSON.stringify({event: eventName});
    try {
      if (navigator.sendBeacon && navigator.sendBeacon(ANALYTICS_ENDPOINT, payload)) return;
    } catch (_) {}
    try {
      if (window.fetch) {
        var request = window.fetch(ANALYTICS_ENDPOINT, {
          method: 'POST', mode: 'no-cors', keepalive: true,
          headers: {'Content-Type': 'text/plain;charset=UTF-8'}, body: payload
        });
        if (request && request.catch) request.catch(function () {});
      }
    } catch (_) {}
  }
  window.addEventListener('pageshow', function () { track('portal_view'); });
  var story = document.querySelector('.choice.story');
  var game = document.querySelector('.choice.game');
  if (story) story.addEventListener('click', function () { track('click_wenweng'); });
  if (game) game.addEventListener('click', function () { track('click_game'); });
}());
</script>
</body></html>
